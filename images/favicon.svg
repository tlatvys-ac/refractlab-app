<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- the bars behind the glass -->
    <g id="bars">
      <rect x="4" y="27" width="112" height="9" rx="4.5" fill="#FF5C8A"/>
      <rect x="4" y="41" width="112" height="9" rx="4.5" fill="#FFB23D"/>
      <rect x="4" y="55" width="112" height="9" rx="4.5" fill="#FFE066"/>
      <rect x="4" y="69" width="112" height="9" rx="4.5" fill="#3DDBB0"/>
      <rect x="4" y="83" width="112" height="9" rx="4.5" fill="#4DA6FF"/>
    </g>
    <clipPath id="glass"><rect x="31" y="14" width="58" height="92" rx="22"/></clipPath>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFF" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <use href="#bars" opacity="0.9"/>
  <!-- through the glass: magnified and shifted, as a lens would -->
  <g clip-path="url(#glass)">
    <rect x="31" y="14" width="58" height="92" fill="#1E2024"/>
    <use href="#bars" transform="translate(60 60) scale(1.14 1.22) translate(-60 -64.5)"/>
    <rect x="31" y="14" width="58" height="92" fill="url(#sheen)"/>
  </g>
  <rect x="31.75" y="14.75" width="56.5" height="90.5" rx="21.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <!-- the corner that catches the light -->
  <path d="M36 44 A 20 20 0 0 1 52 19.5" fill="none" stroke="#FFF" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
</svg>
